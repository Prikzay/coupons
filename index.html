  <script>
    // 自定义 Tailwind 主题色（马卡龙浅粉温柔配色）
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            blush: '#FFE3EC',      // 浅粉背景
            cream: '#FFF9F2',      // 米白
            rose:  '#F78FB3',      // 主粉色
            roseg: '#E8638C',      // 深粉（强调）
            cocoa: '#8A6552',      // 可可棕（正文文字）
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', 'PingFang SC',
                   'Hiragino Sans GB', 'Microsoft YaHei', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <style>
    /* ===== 禁止页面下拉回弹 / 橡皮筋效果 ===== */
    html, body {
      overscroll-behavior: none;
      -webkit-overflow-scrolling: touch;
    }
    img { -webkit-touch-callout: none; }

    /* ===== 弹窗淡入淡出动画 ===== */
    .modal-mask {
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s ease;
    }
    .modal-mask.show { opacity: 1; pointer-events: auto; }
    .modal-box {
      transform: translateY(24px) scale(.96);
      opacity: 0;
      transition: transform .25s ease, opacity .25s ease;
    }
    .modal-mask.show .modal-box {
      transform: translateY(0) scale(1);
      opacity: 1;
    }

    /* ===== 已使用卡片：灰度 + 降透明度 ===== */
    .coupon-used {
      filter: grayscale(.85);
      opacity: .6;
    }

    /* ===== 印章样式（已兑现 / 待确认） ===== */
    .stamp {
      transform: rotate(-18deg);
      border: 2.5px solid #E8638C;
      color: #E8638C;
      letter-spacing: 2px;
      text-shadow: 0 0 1px rgba(232, 99, 140, .4);
    }
    .stamp-pending {
      border-color: #D9A404;
      color: #D9A404;
      text-shadow: 0 0 1px rgba(217, 164, 4, .4);
    }

    /* ===== 成功提示 toast 动画 ===== */
    #toast {
      opacity: 0;
      transform: translate(-50%, -10px);
      transition: opacity .3s ease, transform .3s ease;
    }
    #toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* 虚线打孔分隔线 */
    .perf-line {
      border-top: 2px dashed rgba(247, 143, 179, .45);
    }
  </style>
</head>

<body class="bg-gradient-to-b from-blush via-cream to-blush font-sans text-cocoa select-none">

  <!-- ============ 账号密码登录屏 ============ -->
  <div id="loginScreen" class="fixed inset-0 z-40 bg-gradient-to-b from-blush via-cream to-blush flex items-center justify-center px-8">
    <div class="w-full max-w-[300px] bg-white/90 rounded-3xl shadow-xl shadow-rose/20 p-8 text-center">
      <div class="text-5xl mb-3">💌</div>
      <p class="text-[10px] tracking-[6px] text-rose/70 mb-1">LOVE COUPONS</p>
      <h1 class="text-xl font-bold text-roseg mb-1">情侣兑换券卡包</h1>
      <p class="text-xs text-cocoa/60 mb-6">输入账号密码解锁</p>
      <input id="userInput" type="text" placeholder="账号" autocomplete="username"
        class="w-full text-center py-3 rounded-full border border-rose/30 bg-white text-base text-cocoa placeholder-cocoa/30 outline-none focus:border-rose mb-3" />
      <input id="passInput" type="password" placeholder="密码" autocomplete="current-password"
        class="w-full text-center py-3 rounded-full border border-rose/30 bg-white text-base text-cocoa placeholder-cocoa/30 outline-none focus:border-rose mb-3" />
      <button id="loginBtn" onclick="doLogin()"
        class="w-full py-3 rounded-full bg-gradient-to-r from-rose to-roseg text-white text-base font-bold shadow-lg shadow-rose/40 active:scale-95 transition">
        🔓 解锁卡包
      </button>
      <p id="loginErr" class="hidden text-xs text-roseg mt-3"></p>
    </div>
  </div>

  <!-- ============ 页面主体 ============ -->
  <div id="mainPage" class="hidden max-w-md mx-auto min-h-full px-5 pt-6 pb-8 flex flex-col">

    <!-- ===== 券网格总览（一行两张） ===== -->
    <div id="gridView" class="flex-1">
      <!-- 顶部标题 -->
      <header class="text-center mb-3">
        <p class="text-[10px] tracking-[6px] text-rose/70 mb-1">LOVE COUPONS</p>
        <h1 class="text-2xl font-bold text-roseg">💕 情侣兑换券卡包</h1>
      </header>

      <!-- 剩余可用提示 -->
      <div id="remainTip" class="text-center text-xs text-cocoa/70 bg-white/70 rounded-full py-1.5 px-4 mx-auto w-max mb-4 shadow-sm"></div>

      <div id="couponGrid" class="grid grid-cols-2 gap-3.5"></div>
      <p class="text-center text-[11px] text-cocoa/40 mt-5">👆 点开券卡查看详情、申请使用</p>
    </div>

    <!-- ===== 单张券详情页（紧凑布局，一屏展示完） ===== -->
    <div id="detailView" class="hidden flex-1 flex flex-col">

      <!-- 返回按钮 -->
      <button onclick="showGrid()"
        class="self-start flex items-center gap-1 text-sm font-bold text-roseg bg-white/90 rounded-full pl-3 pr-4 py-1.5 shadow-md mb-3 active:scale-95 transition">
        ‹ 返回卡包
      </button>

      <!-- 票券主体 -->
      <div id="ticket" class="relative rounded-3xl overflow-hidden shadow-xl shadow-rose/20 bg-white">

        <!-- 券头部：插画区域（背景色由 JS 填充） -->
        <div id="tImgWrap" class="h-40 flex items-center justify-center relative">
          <img id="tImg" src="" alt="" class="max-h-full max-w-[70%] object-contain pointer-events-none rounded-xl" />
          <!-- 图片加载失败时的占位图标 -->
          <div id="tImgFallback" class="hidden text-6xl">🎟️</div>
          <!-- 已兑现印章（全部用完时显示） -->
          <div id="tStamp" class="stamp hidden absolute top-3 right-3 text-sm font-bold px-2 py-0.5 rounded-lg bg-white/80">已兑现</div>
          <!-- 待确认印章（有 pending 请求时显示） -->
          <div id="tStampPending" class="stamp stamp-pending hidden absolute top-3 right-3 text-sm font-bold px-2 py-0.5 rounded-lg bg-white/80">待确认</div>
          <!-- 稀有款角标 -->
          <div id="tRare" class="hidden absolute top-3 left-3 text-[10px] font-bold text-white bg-gradient-to-r from-amber-400 to-rose px-2 py-0.5 rounded-full shadow">✨ 稀有款</div>
        </div>

        <!-- 打孔分隔线 -->
        <div class="relative">
          <div class="perf-line mx-5"></div>
          <div class="absolute left-0 top-1/2 -translate-y-1/2 w-5 h-5 bg-blush rounded-full -translate-x-1/2"></div>
          <div class="absolute right-0 top-1/2 -translate-y-1/2 w-5 h-5 bg-blush rounded-full translate-x-1/2"></div>
        </div>

        <!-- 券内容区 -->
        <div class="px-5 py-3">
          <h2 id="tName" class="text-lg font-bold text-roseg text-center"></h2>

          <!-- 剩余张数角标 -->
          <div class="flex justify-center mt-1.5 mb-2.5">
            <span id="tRemain" class="text-[11px] font-bold text-white bg-rose rounded-full px-3 py-0.5"></span>
          </div>

          <!-- 使用效果 -->
          <div class="flex items-start gap-2 mb-2">
            <span class="shrink-0 text-[11px] font-bold text-white bg-rose rounded-full px-2.5 py-0.5 mt-0.5">效果</span>
            <p id="tEffect" class="text-sm leading-relaxed text-cocoa/90"></p>
          </div>
          <!-- 备注 -->
          <div id="tRemarkRow" class="flex items-start gap-2">
            <span class="shrink-0 text-[11px] font-bold text-rose bg-rose/10 rounded-full px-2.5 py-0.5 mt-0.5">备注</span>
            <p id="tRemark" class="text-sm leading-relaxed text-cocoa/60"></p>
          </div>

          <!-- 申请使用按钮（不可用时隐藏） -->
          <button id="tUseBtn" onclick="openApply()"
            class="w-full mt-4 py-3 rounded-full bg-gradient-to-r from-rose to-roseg text-white text-base font-bold shadow-lg shadow-rose/40 active:scale-95 transition">
            🎁 申请使用
          </button>
          <p id="tUsedTip" class="hidden text-center text-sm text-cocoa/50 mt-3">— 这张券已经被兑现啦 —</p>
          <p id="tPendingTip" class="hidden text-center text-sm text-[#D9A404] mt-3">⏳ 已提交使用申请，等他把券盖生效章~</p>
          <p id="tEmptyTip" class="hidden text-center text-sm text-cocoa/50 mt-3">— 这种券暂时没有库存 —</p>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ 申请使用弹窗（备注必填） ============ -->
  <div id="confirmModal" class="modal-mask fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-8">
    <div class="modal-box w-full max-w-[300px] bg-white rounded-3xl p-6 shadow-2xl">
      <div class="text-center">
        <div class="text-4xl mb-2">🥺</div>
        <p class="text-sm leading-relaxed text-cocoa/90 mb-4">
          申请使用「<span id="cName" class="font-bold text-roseg"></span>」<br/>
          <span class="text-xs text-cocoa/60">写好申请理由提交，他确认后才算生效哦！</span>
        </p>
      </div>
      <textarea id="applyNote" rows="3" maxlength="200" placeholder="✍️ 写点申请理由吧（必填）"
        class="w-full text-sm text-cocoa bg-blush/40 rounded-2xl border border-rose/30 p-3 outline-none focus:border-rose resize-none placeholder-cocoa/30 mb-1"></textarea>
      <p id="applyErr" class="hidden text-xs text-roseg mb-1"></p>
      <div class="flex gap-3 mt-3">
        <button onclick="closeApply()"
          class="flex-1 py-2.5 rounded-full bg-gray-100 text-cocoa/70 text-sm font-medium active:scale-95 transition">取消</button>
        <button id="applyBtn" onclick="confirmUse()"
          class="flex-1 py-2.5 rounded-full bg-roseg text-white text-sm font-bold shadow-lg shadow-roseg/40 active:scale-95 transition">提交申请</button>
      </div>
    </div>
  </div>

  <!-- ============ 兑现成功提示 toast ============ -->
  <div id="toast" class="fixed left-1/2 top-24 -translate-x-1/2 z-[60] bg-white/95 text-cocoa text-sm font-medium px-5 py-3 rounded-full shadow-xl whitespace-nowrap">
    ✅ 已提交，等他把券盖生效章~
  </div>

  <script>
    /* ================================================================
     * 数据与服务器
     * ================================================================ */

    // 云函数地址（中转解决跨域，数据库为唯一数据源）
    const API = 'https://prizay-d5g0umrw5133d1dbc.service.tcloudbase.com/coupons-proxy';
    const AUTH_KEY = 'couponsAuth'; // localStorage 存 { user, pass }

    /** 读取本地保存的登录信息 */
    function getAuth() {
      try { return JSON.parse(localStorage.getItem(AUTH_KEY)) || {}; } catch (e) { return {}; }
    }

    // 服务器返回的该账号券数据（含 id/name/effect/remark/img/granted/used/pending/remaining）
    // 数据全部来自后台卡券库，后台发了什么这里才显示什么
    let couponList = [];

    // 券头部插画区背景色（马卡龙色系，按顺序取色）
    const cardColors = ['#FFE3EC','#FFF3D6','#E3F2FD','#E8F5E9','#F3E5F5','#FFEBE5'];

    // 当前展示的券下标
    let currentIndex = 0;

    /** 带登录信息的 API 请求封装（账号密码放 body，中文过不了请求头） */
    async function api(path, opts = {}) {
      const auth = getAuth();
      const body = Object.assign({ user: auth.user || '', pass: auth.pass || '' }, JSON.parse(opts.body || '{}'));
      const res = await fetch(API + path, Object.assign({}, opts, {
        headers: Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {}),
        body: JSON.stringify(body),
      }));
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        if (res.status === 401) { logout(); }
        throw new Error(data.error || ('请求失败 ' + res.status));
      }
      return data;
    }

    /** 把服务器数据写入本地券列表 */
    function applyStock(coupons) {
      couponList = coupons || [];
      renderGrid();
      renderTicket();
    }

    /* ================================================================
     * 账号密码登录
     * ================================================================ */

    /** 登录（也用于 localStorage 自动登录），silent=true 时不显示加载/报错 */
    async function doLogin(silent) {
      const userInput = document.getElementById('userInput');
      const passInput = document.getElementById('passInput');
      const err = document.getElementById('loginErr');
      const btn = document.getElementById('loginBtn');
      const saved = getAuth();
      const user = silent ? (saved.user || '') : userInput.value.trim();
      const pass = silent ? (saved.pass || '') : passInput.value.trim();
      if (!user || !pass) { if (!silent) showErr('账号和密码都要填哦'); return; }
      if (!silent) {
        btn.disabled = true; btn.textContent = '解锁中…'; err.classList.add('hidden');
      }
      try {
        const data = await fetch(API + '/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user, pass }),
        }).then(r => r.json().then(d => ({ ok: r.ok, d })));
        if (!data.ok) throw new Error(data.d.error || '账号或密码不对哦');
        localStorage.setItem(AUTH_KEY, JSON.stringify({ user, pass }));
        applyStock(data.d.coupons);
        enterMain();
      } catch (e) {
        localStorage.removeItem(AUTH_KEY);
        if (!silent) showErr(e.message);
      } finally {
        if (!silent) { btn.disabled = false; btn.textContent = '🔓 解锁卡包'; }
      }
      function showErr(msg) { err.textContent = msg; err.classList.remove('hidden'); }
    }

    /** 进入主页面 */
    function enterMain() {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('mainPage').classList.remove('hidden');
    }

    /** 登录失效：回登录屏 */
    function logout() {
      localStorage.removeItem(AUTH_KEY);
      document.getElementById('mainPage').classList.add('hidden');
      document.getElementById('loginScreen').style.display = 'flex';
    }

    /* ================================================================
     * 渲染
     * ================================================================ */

    /** 判断某张券的展示状态：pending 待确认 / usedout 全部兑现 / ok 可用 */
    function stateOf(c) {
      if (c.pending > 0) return 'pending';
      if (c.remaining <= 0 && c.used > 0) return 'usedout';
      if (c.remaining <= 0) return 'empty';
      return 'ok';
    }

    /**
     * 渲染券网格总览（一行两张，只显示后台发给她的券）
     * @returns 可见券种数量
     */
    function renderGrid() {
      const grid = document.getElementById('couponGrid');
      grid.innerHTML = '';
      couponList.forEach((c, i) => {
        const st = stateOf(c);
        const card = document.createElement('div');
        card.onclick = () => openDetail(i);
        card.className = 'relative rounded-2xl overflow-hidden shadow-md shadow-rose/10 bg-white active:scale-95 transition cursor-pointer'
          + (st === 'usedout' ? ' coupon-used' : '');
        // 徽标文案与配色
        let badge, badgeCls;
        if (st === 'pending') { badge = `⏳ ${c.pending} 张待确认`; badgeCls = 'bg-amber-500'; }
        else if (st === 'usedout') { badge = '已全部兑现'; badgeCls = 'bg-cocoa/40'; }
        else { badge = `还剩 ${c.remaining} 张`; badgeCls = 'bg-rose'; }
        card.innerHTML =
          `<div class="h-28 flex items-center justify-center" style="background:linear-gradient(160deg, ${cardColors[i % cardColors.length]}, #ffffff)">`
          + `<img src="${c.img}" alt="${c.name}" class="max-h-full max-w-[80%] object-contain pointer-events-none" onerror="this.style.display='none'"/>`
          + (st === 'pending' ? '<span class="stamp stamp-pending absolute top-1.5 right-1.5 text-[10px] font-bold px-1.5 py-0.5 rounded-md bg-white/85">待确认</span>' : '')
          + (st === 'usedout' ? '<span class="stamp absolute top-1.5 right-1.5 text-[10px] font-bold px-1.5 py-0.5 rounded-md bg-white/85">已兑现</span>' : '')
          + '</div>'
          + '<div class="p-2.5 text-center">'
          + `<p class="text-[13px] font-bold text-roseg mb-1.5 truncate">${c.name}</p>`
          + `<span class="inline-block text-[10px] font-bold text-white rounded-full px-2.5 py-0.5 ${badgeCls}">${badge}</span>`
          + '</div>';
        grid.appendChild(card);
      });
      // 一张券都没有时给个占位提示
      if (!couponList.length) {
        grid.innerHTML = '<div class="col-span-2 text-center text-sm text-cocoa/50 bg-white/70 rounded-2xl py-12">🎁 卡包空空的<br/>等他在后台给你发券哦~</div>';
      }
      return couponList.length;
    }

    /** 从网格进入某张券的详情页 */
    function openDetail(i) {
      currentIndex = i;
      renderTicket();
      document.getElementById('gridView').classList.add('hidden');
      document.getElementById('detailView').classList.remove('hidden');
      window.scrollTo(0, 0);
    }

    /** 返回网格总览 */
    function showGrid() {
      document.getElementById('detailView').classList.add('hidden');
      document.getElementById('gridView').classList.remove('hidden');
      renderGrid();
      window.scrollTo(0, 0);
    }

    /**
     * 渲染当前券到票面
     */
    function renderTicket() {
      const c = couponList[currentIndex];
      if (!c) return;
      const st = stateOf(c);

      // 插画区背景色 + 图片
      document.getElementById('tImgWrap').style.background =
        `linear-gradient(160deg, ${cardColors[currentIndex % cardColors.length]}, #ffffff)`;
      const img = document.getElementById('tImg');
      const fallback = document.getElementById('tImgFallback');
      // 图片加载失败时隐藏图片、显示占位图标
      img.onerror = () => { img.classList.add('hidden'); fallback.classList.remove('hidden'); };
      img.onload = () => fallback.classList.add('hidden');
      img.src = c.img;
      img.alt = c.name;

      // 文案
      document.getElementById('tName').textContent = c.name;
      document.getElementById('tEffect').textContent = c.effect;
      document.getElementById('tRemark').textContent = c.remark || '无';
      document.getElementById('tRemarkRow').style.display = c.remark ? 'flex' : 'none';

      // 三种印章/状态：待确认（黄）> 已兑现（灰度）> 可用
      const usedOut = st === 'usedout';
      const isPending = st === 'pending';
      document.getElementById('ticket').classList.toggle('coupon-used', usedOut);
      document.getElementById('tStamp').classList.toggle('hidden', !usedOut);
      document.getElementById('tStampPending').classList.toggle('hidden', !isPending);
      document.getElementById('tUseBtn').classList.toggle('hidden', st !== 'ok');
      document.getElementById('tUsedTip').classList.toggle('hidden', !usedOut);
      document.getElementById('tPendingTip').classList.toggle('hidden', !isPending);
      document.getElementById('tEmptyTip').classList.toggle('hidden', st !== 'empty');

      // 剩余张数角标（待确认时把数量角标换成黄色）
      const badge = document.getElementById('tRemain');
      badge.textContent = isPending
        ? `⏳ ${c.pending} 张待确认 · 还剩 ${c.remaining} 张`
        : `还剩 ${c.remaining} 张`;
      badge.className = 'text-[11px] font-bold text-white rounded-full px-3 py-1 '
        + (isPending ? 'bg-amber-500' : 'bg-rose');

      // 更新剩余可用提示
      const remain = couponList.reduce((n, x) => n + (x.remaining || 0), 0);
      document.getElementById('remainTip').textContent = couponList.length
        ? `💖 还剩 ${remain} 张券可用，共 ${couponList.length} 种`
        : '🎁 卡包还是空的，等他发放券哦';
    }

    /* ================================================================
     * 使用流程
     * ================================================================ */

    /** 打开弹窗 */
    function openModal(id) { document.getElementById(id).classList.add('show'); }

    /** 关闭弹窗 */
    function closeModal(id) { document.getElementById(id).classList.remove('show'); }

    /**
     * 打开申请使用弹窗（备注必填）
     */
    function openApply() {
      const c = couponList[currentIndex];
      if (stateOf(c) !== 'ok') return;
      document.getElementById('cName').textContent = c.name;
      document.getElementById('applyNote').value = '';
      document.getElementById('applyErr').classList.add('hidden');
      openModal('confirmModal');
      setTimeout(() => document.getElementById('applyNote').focus(), 260);
    }

    /** 关闭申请弹窗 */
    function closeApply() { closeModal('confirmModal'); }

    /**
     * 提交使用申请：备注必填 → POST /use → 刷新票面和网格 → toast
     */
    async function confirmUse() {
      const c = couponList[currentIndex];
      if (stateOf(c) !== 'ok') { closeApply(); return; }
      const noteEl = document.getElementById('applyNote');
      const errEl = document.getElementById('applyErr');
      const note = noteEl.value.trim();
      if (!note) {
        errEl.textContent = '申请理由不能为空哦，写两句吧~';
        errEl.classList.remove('hidden');
        noteEl.focus();
        return;
      }
      errEl.classList.add('hidden');
      const btn = document.getElementById('applyBtn');
      btn.disabled = true; btn.textContent = '提交中…';
      try {
        const data = await api('/use', { method: 'POST', body: JSON.stringify({ coupon_id: c.id, note }) });
        applyStock(data.coupons);
        closeApply();
        showToast();
      } catch (e) {
        errEl.textContent = e.message;
        errEl.classList.remove('hidden');
        // 失败时也刷新一次（可能库存已变）
        refreshStock().catch(() => {});
      } finally {
        btn.disabled = false; btn.textContent = '提交申请';
      }
    }

    /** 静默刷新库存数据 */
    async function refreshStock() {
      const data = await api('/login', { method: 'POST', body: '{}' });
      applyStock(data.coupons);
    }

    /**
     * 成功提示 toast（2 秒后自动消失）
     */
    function showToast() {
      const t = document.getElementById('toast');
      t.classList.add('show');
      clearTimeout(t._timer);
      t._timer = setTimeout(() => t.classList.remove('show'), 2200);
    }

    /* ================================================================
     * 事件绑定与初始化
     * ================================================================ */

    // 点击申请弹窗遮罩关闭（点内容本身不关闭）
    document.getElementById('confirmModal').addEventListener('click', e => {
      if (e.target === e.currentTarget) closeModal('confirmModal');
    });

    // 输入框回车登录（密码框回车优先）
    ['userInput', 'passInput'].forEach(id => {
      document.getElementById(id).addEventListener('keydown', e => {
        if (e.key === 'Enter') doLogin(false);
      });
    });

    // 初始化：本地存过登录信息则静默自动登录，否则停在登录屏
    if (getAuth().user) doLogin(true);
    renderGrid();
    renderTicket();
  </script>
</body>
</html>
