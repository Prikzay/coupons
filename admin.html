<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>恋爱卡券管理系统</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f3f5f9;
    color: #3a3f4b;
    font-size: 14px;
  }
  button { font-family: inherit; cursor: pointer; }
  input, select {
    font-family: inherit; font-size: 13px;
    border: 1px solid #e2e6ee; border-radius: 8px;
    padding: 9px 12px; outline: none; background: #fff; color: #3a3f4b;
  }
  input:focus, select:focus { border-color: #e8638c; }

  /* ===== 登录屏 ===== */
  #login {
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  #login .box {
    background: #fff; border-radius: 16px; padding: 38px 32px; width: 100%; max-width: 340px;
    box-shadow: 0 8px 30px rgba(30,40,60,.08); text-align: center;
  }
  #login .logo { width: 52px; height: 52px; border-radius: 14px; background: #ffe3ec; display: flex; align-items: center; justify-content: center; font-size: 26px; margin: 0 auto 14px; }
  #login h1 { font-size: 18px; margin-bottom: 4px; }
  #login .sub { font-size: 12px; color: #9aa3b2; margin-bottom: 22px; }
  #login input { width: 100%; margin-bottom: 12px; text-align: left; }
  .btn-primary {
    border: none; border-radius: 8px; background: #e8638c; color: #fff;
    font-size: 14px; font-weight: 600; padding: 11px 0; width: 100%;
  }
  .btn-primary:disabled { opacity: .6; }
  #err { margin-top: 10px; color: #d64541; font-size: 13px; }

  /* ===== 整体布局 ===== */
  #app { display: none; min-height: 100vh; }
  #sidebar {
    position: fixed; left: 0; top: 0; bottom: 0; width: 190px; z-index: 30;
    background: #212734; color: #aab2c0; display: flex; flex-direction: column;
  }
  #sidebar .brand {
    display: flex; align-items: center; gap: 9px; padding: 20px 16px;
    color: #fff; font-size: 15px; font-weight: 700; border-bottom: 1px solid rgba(255,255,255,.07);
  }
  #sidebar .brand .mark {
    width: 32px; height: 32px; border-radius: 9px; background: #e8638c; flex: none;
    display: flex; align-items: center; justify-content: center; font-size: 16px;
  }
  #sidebar nav { padding: 12px 10px; flex: 1; }
  .nav-item {
    display: flex; align-items: center; gap: 10px; width: 100%;
    padding: 11px 14px; margin-bottom: 4px; border: none; border-radius: 9px;
    background: none; color: #aab2c0; font-size: 14px; text-align: left;
  }
  .nav-item.active { background: #e8638c; color: #fff; font-weight: 600; }
  .nav-item:not(.active):hover { background: rgba(255,255,255,.06); color: #fff; }
  #sidebar .foot { padding: 16px; font-size: 11px; color: #6b7383; border-top: 1px solid rgba(255,255,255,.07); }

  #main { margin-left: 190px; display: flex; flex-direction: column; min-height: 100vh; }
  #topbar {
    background: #fff; padding: 0 22px; height: 56px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid #e9edf3;
  }
  #topbar .ptitle { font-size: 15px; font-weight: 700; }
  .admin-menu { position: relative; }
  .admin-btn {
    display: flex; align-items: center; gap: 8px; border: none; background: none;
    font-size: 13px; color: #3a3f4b; padding: 6px 8px; border-radius: 8px;
  }
  .admin-btn:hover { background: #f3f5f9; }
  .avatar {
    width: 28px; height: 28px; border-radius: 50%; background: #ffe3ec;
    display: flex; align-items: center; justify-content: center; font-size: 14px;
  }
  .dropdown {
    display: none; position: absolute; right: 0; top: 40px; background: #fff;
    border: 1px solid #e9edf3; border-radius: 10px; box-shadow: 0 8px 24px rgba(30,40,60,.12);
    min-width: 120px; overflow: hidden; z-index: 40;
  }
  .dropdown.show { display: block; }
  .dropdown button {
    display: block; width: 100%; padding: 10px 14px; border: none; background: none;
    font-size: 13px; color: #d64541; text-align: left;
  }
  .dropdown button:hover { background: #fdf3f6; }

  #content { padding: 22px; flex: 1; width: 100%; max-width: 1000px; }
  .page { display: none; }
  .page.show { display: block; }
  .page-head { margin-bottom: 16px; }
  .page-head h2 { font-size: 19px; margin-bottom: 3px; }
  .page-head .desc { font-size: 12px; color: #9aa3b2; }

  .card {
    background: #fff; border-radius: 12px; box-shadow: 0 2px 10px rgba(30,40,60,.05);
  }

  /* ===== 首页统计 ===== */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 18px; }
  .stat { padding: 16px 18px; display: flex; align-items: center; gap: 12px; }
  .stat .ico { width: 42px; height: 42px; border-radius: 11px; display: flex; align-items: center; justify-content: center; font-size: 20px; flex: none; }
  .stat .num { font-size: 22px; font-weight: 800; line-height: 1.1; }
  .stat .lbl { font-size: 12px; color: #9aa3b2; margin-top: 2px; }

  h3.sec { font-size: 15px; margin: 22px 0 10px; }
  h3.sec:first-child { margin-top: 0; }

  /* ===== 待确认申请卡片 ===== */
  .req-card { padding: 13px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; border-bottom: 1px solid #f2f4f8; }
  .req-card:last-child { border-bottom: none; }
  .req-card .info { flex: 1; min-width: 200px; }
  .req-card .cname { font-weight: 700; font-size: 14px; color: #e8638c; }
  .req-card .rtime { font-size: 12px; color: #9aa3b2; margin-top: 2px; }
  .req-card .note { font-size: 13px; color: #3a3f4b; margin-top: 4px; background: #fdf3f6; border-radius: 8px; padding: 6px 10px; }
  .btn-ok, .btn-no {
    border: none; border-radius: 8px; color: #fff; font-size: 13px; padding: 8px 16px; font-weight: 600;
  }
  .btn-ok { background: #35a16b; }
  .btn-no { background: #b6bdc9; }
  .btn-ok:disabled, .btn-no:disabled { opacity: .5; }

  /* ===== 表格 ===== */
  table.tbl {
    width: 100%; border-collapse: collapse; background: #fff; border-radius: 12px;
    overflow: hidden; box-shadow: 0 2px 10px rgba(30,40,60,.05); font-size: 13px;
  }
  .tbl th, .tbl td { padding: 11px 12px; text-align: left; border-bottom: 1px solid #f2f4f8; vertical-align: middle; }
  .tbl th { background: #f8f9fc; font-weight: 600; color: #7a8296; white-space: nowrap; font-size: 12px; }
  .tbl tr:last-child td { border-bottom: none; }
  .cwrap { display: flex; align-items: center; gap: 10px; }
  .cthumb { width: 56px; height: 40px; object-fit: cover; border-radius: 6px; background: #f3f5f9; flex: none; }
  .cname { font-weight: 600; white-space: nowrap; }
  .rare-tag { font-size: 10px; color: #fff; background: linear-gradient(90deg,#f7b944,#e8638c); border-radius: 99px; padding: 1px 7px; margin-left: 5px; }
  .nums { color: #5a6272; white-space: nowrap; }
  .nums.hl { font-weight: 700; color: #e8638c; }
  .tag { display: inline-block; padding: 3px 10px; border-radius: 6px; font-size: 12px; color: #fff; white-space: nowrap; }
  .tag-green { background: #35a16b; }
  .tag-amber { background: #dfa227; }
  .tag-gray { background: #b6bdc9; }
  .time-sub { color: #9aa3b2; font-size: 12px; }
  .note-cell { max-width: 180px; word-break: break-all; white-space: normal; }
  .grant-input { width: 56px; padding: 6px 6px; text-align: center; }
  .btn-mini {
    border: none; border-radius: 7px; background: #e8638c; color: #fff;
    font-size: 12px; font-weight: 600; padding: 7px 13px; white-space: nowrap;
  }
  .btn-mini:disabled { opacity: .5; }
  .btn-ghost {
    border: none; background: none; font-size: 13px; padding: 4px 6px;
  }
  .btn-edit { color: #4a7de0; font-weight: 600; }
  .btn-del { color: #d64541; font-weight: 600; }
  .empty { color: #9aa3b2; padding: 26px 0; text-align: center; font-size: 13px; }
  #data-err { margin: 0 0 12px; color: #d64541; font-size: 13px; }

  /* ===== 账户管理 ===== */
  .add-account { display: flex; gap: 10px; flex-wrap: wrap; padding: 16px 18px; align-items: center; }
  .add-account input { flex: 1; min-width: 130px; }
  .toolbar { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .toolbar select { min-width: 120px; }

  /* ===== 移动端 ===== */
  #mobilenav { display: none; }
  @media (max-width: 767px) {
    #sidebar { display: none; }
    #main { margin-left: 0; }
    #content { padding: 16px 14px 90px; }
    .stats { grid-template-columns: repeat(2, 1fr); }
    .tbl th, .tbl td { padding: 9px 8px; }
    .hidesm { display: none; }
    #mobilenav {
      display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
      background: #fff; border-top: 1px solid #e9edf3;
      padding-bottom: env(safe-area-inset-bottom);
    }
    #mobilenav button {
      flex: 1; border: none; background: none; padding: 9px 0 7px;
      font-size: 11px; color: #9aa3b2;
    }
    #mobilenav button .mi { display: block; font-size: 19px; margin-bottom: 1px; }
    #mobilenav button.active { color: #e8638c; font-weight: 700; }
  }
</style>
</head>
<body>

<!-- ============ 登录屏 ============ -->
<div id="login">
  <div class="box">
    <div class="logo">🎟️</div>
    <h1>恋爱卡券管理系统</h1>
    <div class="sub">管理员登录</div>
    <input type="password" id="pwd" placeholder="请输入管理密码">
    <button class="btn-primary" id="btn-login">登 录</button>
    <div id="err"></div>
  </div>
</div>

<!-- ============ 主体 ============ -->
<div id="app">

  <!-- 侧边栏（桌面端） -->
  <div id="sidebar">
    <div class="brand"><span class="mark">🎟️</span>恋爱卡券管理系统</div>
    <nav>
      <button class="nav-item active" data-page="home">🏠 首页</button>
      <button class="nav-item" data-page="coupons">🎫 卡券管理</button>
      <button class="nav-item" data-page="logs">📜 使用记录</button>
      <button class="nav-item" data-page="accounts">👥 账户管理</button>
    </nav>
    <div class="foot">💗 让生活更有仪式感</div>
  </div>

  <div id="main">
    <!-- 顶栏 -->
    <div id="topbar">
      <span class="ptitle" id="ptitle">首页</span>
      <div class="admin-menu">
        <button class="admin-btn" id="adminBtn"><span class="avatar">👩</span>管理员 ▾</button>
        <div class="dropdown" id="adminDrop">
          <button id="btn-logout">退出登录</button>
        </div>
      </div>
    </div>

    <div id="content">
      <div id="data-err"></div>

      <!-- ===== 首页 ===== -->
      <div class="page show" id="page-home">
        <div class="page-head">
          <h2>首页</h2>
          <div class="desc">卡券发放与使用总览</div>
        </div>
        <div class="stats">
          <div class="card stat"><span class="ico" style="background:#fdf0d8">🎁</span><div><div class="num" id="st-grant">-</div><div class="lbl">累计发放（张）</div></div></div>
          <div class="card stat"><span class="ico" style="background:#e2f3e9">✅</span><div><div class="num" id="st-used">-</div><div class="lbl">已生效（张）</div></div></div>
          <div class="card stat"><span class="ico" style="background:#fff3d6">⏳</span><div><div class="num" id="st-pending">-</div><div class="lbl">待确认（张）</div></div></div>
          <div class="card stat"><span class="ico" style="background:#ffe3ec">💖</span><div><div class="num" id="st-remain">-</div><div class="lbl">剩余可用（张）</div></div></div>
        </div>

        <h3 class="sec">⏳ 待确认的用券申请</h3>
        <div class="card" id="pending-list"><div class="empty">加载中…</div></div>
      </div>

      <!-- ===== 卡券管理 ===== -->
      <div class="page" id="page-coupons">
        <div class="page-head">
          <h2>卡券管理</h2>
          <div class="desc">管理 12 种卡券的发放数量与库存</div>
        </div>
        <table class="tbl">
          <thead>
            <tr><th>卡券</th><th class="hidesm">状态</th><th>已发</th><th class="hidesm">已用</th><th class="hidesm">待确认</th><th>剩余</th><th>发放</th></tr>
          </thead>
          <tbody id="stock-tbody"></tbody>
        </table>
      </div>

      <!-- ===== 使用记录 ===== -->
      <div class="page" id="page-logs">
        <div class="page-head">
          <h2>使用记录</h2>
          <div class="desc">她的用券申请与处理记录（最近 200 条）</div>
        </div>
        <div class="toolbar">
          <select id="log-filter">
            <option value="">全部状态</option>
            <option value="pending">待确认</option>
            <option value="confirmed">已生效</option>
            <option value="rejected">已拒绝</option>
          </select>
        </div>
        <table class="tbl">
          <thead>
            <tr><th>券种</th><th>状态</th><th>申请理由</th><th>申请时间</th><th class="hidesm">处理时间</th><th>操作</th></tr>
          </thead>
          <tbody id="log-tbody"></tbody>
        </table>
      </div>

      <!-- ===== 账户管理 ===== -->
      <div class="page" id="page-accounts">
        <div class="page-head">
          <h2>账户管理</h2>
          <div class="desc">管理女朋友端的登录账号（新增 / 改密码 / 删除）</div>
        </div>

        <h3 class="sec">➕ 新增账号</h3>
        <div class="card add-account">
          <input type="text" id="acc-user" placeholder="账号名称" maxlength="20">
          <input type="text" id="acc-pass" placeholder="初始密码" maxlength="30">
          <button class="btn-mini" id="btn-add-acc" style="padding:9px 18px">+ 新增账号</button>
        </div>

        <h3 class="sec">👥 已有账号</h3>
        <table class="tbl">
          <thead><tr><th>账号名称</th><th class="hidesm">创建时间</th><th>操作</th></tr></thead>
          <tbody id="acc-tbody"><tr><td colspan="3" class="empty">加载中…</td></tr></tbody>
        </table>
      </div>

    </div>
  </div>

  <!-- 移动端底部导航 -->
  <div id="mobilenav">
    <button class="active" data-page="home"><span class="mi">🏠</span>首页</button>
    <button data-page="coupons"><span class="mi">🎫</span>卡券</button>
    <button data-page="logs"><span class="mi">📜</span>记录</button>
    <button data-page="accounts"><span class="mi">👥</span>账户</button>
  </div>
</div>

/* ======== 配置 ======== */
var PROXY = "https://prizay-d5g0umrw5133d1dbc.service.tcloudbase.com/coupons-proxy";
var ADMIN_PASSWORD = "";

/* 封面缩略图（构建时内嵌） */
;

/* 券名（和女朋友页 couponList 一致） */
var couponNames = {
  1: "亲亲券", 2: "抱抱券", 3: "使唤券", 4: "陪聊券",
  5: "免生气券", 6: "投喂券", 7: "约会选择权券", 8: "按摩券",
  9: "熬夜陪伴券", 10: "夸夸券", 11: "耍赖券", 12: "心愿特权券"
};
var rareCoupons = { 12: true };
var statusNames = { pending: "待确认", confirmed: "已生效", rejected: "已拒绝" };
var statusCls = { pending: "tag-amber", confirmed: "tag-green", rejected: "tag-gray" };
var PAGE_TITLES = { home: "首页", coupons: "卡券管理", logs: "使用记录", accounts: "账户管理" };

var overviewData = null;

/* ---------- 工具 ---------- */
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (ch) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
  });
}
function fmtTime(s) {
  if (!s) return "-";
  var d = new Date(s);
  function p(n) { return n < 10 ? "0" + n : n; }
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + " "
    + p(d.getHours()) + ":" + p(d.getMinutes());
}
function errBox(msg) { document.getElementById("data-err").textContent = msg || ""; }

/* ---------- 页面切换 ---------- */
function goto(page) {
  document.querySelectorAll(".page").forEach(function (el) { el.classList.remove("show"); });
  document.getElementById("page-" + page).classList.add("show");
  document.querySelectorAll("[data-page]").forEach(function (b) {
    b.classList.toggle("active", b.getAttribute("data-page") === page);
  });
  document.getElementById("ptitle").textContent = PAGE_TITLES[page];
  window.scrollTo(0, 0);
}
document.querySelectorAll("[data-page]").forEach(function (b) {
  b.addEventListener("click", function () { goto(b.getAttribute("data-page")); });
});

/* ---------- 管理员菜单 ---------- */
document.getElementById("adminBtn").addEventListener("click", function (e) {
  e.stopPropagation();
  document.getElementById("adminDrop").classList.toggle("show");
});
document.addEventListener("click", function () {
  document.getElementById("adminDrop").classList.remove("show");
});
document.getElementById("btn-logout").addEventListener("click", function () {
  location.reload();
});

/* ---------- 加载概览 ---------- */
function load() {
  errBox("");
  document.getElementById("pending-list").innerHTML = '<div class="empty">加载中…</div>';
  fetch(PROXY + "/admin/overview", { headers: { "X-Admin-Password": ADMIN_PASSWORD } })
    .then(function (r) {
      if (r.status === 401) throw new Error("登录已失效，请刷新页面重新登录");
      if (!r.ok) throw new Error("接口返回 " + r.status);
      return r.json();
    })
    .then(function (data) {
      overviewData = data;
      renderHome(data);
      renderStock(data.coupons || []);
      renderLog(data.requests || []);
    })
    .catch(function (err) {
      document.getElementById("pending-list").innerHTML = "";
      errBox("加载失败：" + (err.message || err) + "，请刷新重试");
    });
}

/* ---------- 首页 ---------- */
function renderHome(data) {
  var coupons = data.coupons || [];
  var sum = function (k) { return coupons.reduce(function (n, c) { return n + (c[k] || 0); }, 0); };
  document.getElementById("st-grant").textContent = sum("granted");
  document.getElementById("st-used").textContent = sum("used");
  document.getElementById("st-pending").textContent = sum("pending");
  document.getElementById("st-remain").textContent = sum("remaining");

  var box = document.getElementById("pending-list");
  var pending = (data.requests || []).filter(function (r) { return r.status === "pending"; });
  if (!pending.length) {
    box.innerHTML = '<div class="empty">暂时没有待确认的申请 🎉</div>';
    return;
  }
  box.innerHTML = pending.map(function (r) {
    return '<div class="req-card">'
      + '<div class="info">'
      + '<div class="cname">🎟️ ' + (couponNames[r.coupon_id] || ("券 #" + r.coupon_id)) + '</div>'
      + '<div class="rtime">申请时间：' + fmtTime(r.requested_at) + '</div>'
      + (r.note ? '<div class="note">📝 ' + esc(r.note) + '</div>' : '')
      + '</div>'
      + '<button class="btn-ok" onclick="handle(' + r.id + ',\'confirm\')">✓ 确认生效</button>'
      + '<button class="btn-no" onclick="handle(' + r.id + ',\'reject\')">✕ 拒绝</button>'
      + '</div>';
  }).join("");
}

/* ---------- 卡券管理 ---------- */
function renderStock(coupons) {
  var tbody = document.getElementById("stock-tbody");
  tbody.innerHTML = coupons.map(function (c) {
    var status, tag;
    if (c.granted <= 0) { status = "未发放"; tag = "tag-gray"; }
    else if (c.remaining <= 0 && c.used > 0) { status = "已用完"; tag = "tag-amber"; }
    else { status = "正常"; tag = "tag-green"; }
    return '<tr>'
      + '<td><div class="cwrap">'
      + (COUPON_IMGS[c.id] ? '<img class="cthumb" src="' + COUPON_IMGS[c.id] + '" alt="">' : '')
      + '<span class="cname">' + (couponNames[c.id] || ("券 #" + c.id)) + (rareCoupons[c.id] ? '<span class="rare-tag">稀有款</span>' : '') + '</span>'
      + '</div></td>'
      + '<td class="hidesm"><span class="tag ' + tag + '">' + status + '</span></td>'
      + '<td class="nums">' + c.granted + '</td>'
      + '<td class="nums hidesm">' + c.used + '</td>'
      + '<td class="nums hidesm">' + (c.pending ? '<span style="color:#dfa227;font-weight:700">' + c.pending + '</span>' : '0') + '</td>'
      + '<td class="nums hl">' + c.remaining + '</td>'
      + '<td><input class="grant-input" type="number" min="1" id="grant-num-' + c.id + '" value="1">'
      + ' <button class="btn-mini" onclick="grant(' + c.id + ')">+发放</button></td>'
      + '</tr>';
  }).join("");
}

function grant(couponId) {
  var input = document.getElementById("grant-num-" + couponId);
  var add = parseInt(input.value, 10);
  if (!add || add < 1) { alert("请输入大于 0 的发放数量"); return; }
  var name = couponNames[couponId] || ("券 #" + couponId);
  if (!confirm("确定给「" + name + "」发放 " + add + " 张吗？")) return;
  errBox("");
  fetch(PROXY + "/admin/grant", {
    method: "POST",
    headers: { "Content-Type": "application/json", "X-Admin-Password": ADMIN_PASSWORD },
    body: JSON.stringify({ coupon_id: couponId, add: add })
  }).then(function (r) {
    return r.json().then(function (d) { return { ok: r.ok, d: d }; });
  }).then(function (res) {
    if (!res.ok) throw new Error((res.d && res.d.error) || "接口返回错误");
    load();
  }).catch(function (err) {
    errBox("发放失败：" + (err.message || err));
  });
}

/* ---------- 使用记录 ---------- */
function renderLog(requests) {
  var filter = document.getElementById("log-filter").value;
  var rows = requests.filter(function (r) { return !filter || r.status === filter; });
  var tbody = document.getElementById("log-tbody");
  if (!rows.length) {
    tbody.innerHTML = '<tr><td colspan="6" class="empty">暂无记录</td></tr>';
    return;
  }
  tbody.innerHTML = rows.map(function (r) {
    var act = r.status === "pending"
      ? '<button class="btn-ghost btn-edit" onclick="handle(' + r.id + ',\'confirm\')">确认</button>'
        + '<button class="btn-ghost btn-del" onclick="handle(' + r.id + ',\'reject\')">拒绝</button>'
      : '<span class="time-sub">已处理</span>';
    return '<tr>'
      + '<td class="cname">' + (couponNames[r.coupon_id] || ("券 #" + r.coupon_id)) + '</td>'
      + '<td><span class="tag ' + (statusCls[r.status] || "tag-gray") + '">' + (statusNames[r.status] || r.status) + '</span></td>'
      + '<td class="note-cell">' + esc(r.note || '-') + '</td>'
      + '<td class="time-sub">' + fmtTime(r.requested_at) + '</td>'
      + '<td class="time-sub hidesm">' + (r.handled_at ? fmtTime(r.handled_at) : "未处理") + '</td>'
      + '<td>' + act + '</td>'
      + '</tr>';
  }).join("");
}
document.getElementById("log-filter").addEventListener("change", function () {
  if (overviewData) renderLog(overviewData.requests || []);
});

/* ---------- 确认 / 拒绝 ---------- */
function handle(requestId, action) {
  var verb = action === "confirm" ? "确认生效" : "拒绝";
  if (!confirm("确定要" + verb + "这条用券申请吗？")) return;
  errBox("");
  fetch(PROXY + "/admin/handle", {
    method: "POST",
    headers: { "Content-Type": "application/json", "X-Admin-Password": ADMIN_PASSWORD },
    body: JSON.stringify({ request_id: requestId, action: action })
  }).then(function (r) {
    return r.json().then(function (d) { return { ok: r.ok, d: d }; });
  }).then(function (res) {
    if (!res.ok) throw new Error((res.d && res.d.error) || "接口返回错误");
    load();
  }).catch(function (err) {
    errBox(verb + "失败：" + (err.message || err));
  });
}

/* ---------- 账户管理 ---------- */
function loadAccounts() {
  var tbody = document.getElementById("acc-tbody");
  fetch(PROXY + "/admin/accounts", { headers: { "X-Admin-Password": ADMIN_PASSWORD } })
    .then(function (r) {
      if (r.status === 401) throw new Error("登录已失效，请刷新页面重新登录");
      if (!r.ok) throw new Error("接口返回 " + r.status);
      return r.json();
    })
    .then(function (data) {
      var list = data.accounts || [];
      if (!list.length) {
        tbody.innerHTML = '<tr><td colspan="3" class="empty">还没有账号</td></tr>';
        return;
      }
      tbody.innerHTML = list.map(function (a) {
        var onlyOne = list.length <= 1;
        return '<tr>'
          + '<td><div class="cwrap"><span class="avatar">👩</span><span class="cname">' + esc(a.username) + '</span></div></td>'
          + '<td class="time-sub hidesm">' + fmtTime(a.created_at) + '</td>'
          + '<td>'
          + '<button class="btn-ghost btn-edit" onclick="changePass(\'' + esc(a.username).replace(/'/g, "\\'") + '\')">修改密码</button>'
          + (onlyOne ? '<span class="time-sub" title="至少保留一个账号">不可删除</span>'
                      : '<button class="btn-ghost btn-del" onclick="delAccount(\'' + esc(a.username).replace(/'/g, "\\'") + '\')">删除</button>')
          + '</td>'
          + '</tr>';
      }).join("");
    })
    .catch(function (err) {
      tbody.innerHTML = '<tr><td colspan="3" class="empty">加载失败：' + esc(err.message || err) + '</td></tr>';
    });
}

document.getElementById("btn-add-acc").addEventListener("click", function () {
  var u = document.getElementById("acc-user").value.trim();
  var p = document.getElementById("acc-pass").value.trim();
  if (!u || !p) { alert("账号名称和初始密码都要填哦"); return; }
  if (!confirm("确定新增账号「" + u + "」吗？")) return;
  adminAction("admin/account_add", { user: u, pass: p }, "新增账号").then(function () {
    document.getElementById("acc-user").value = "";
    document.getElementById("acc-pass").value = "";
    loadAccounts();
  });
});

function changePass(u) {
  var p = prompt("给账号「" + u + "」设置新密码：");
  if (p === null) return;
  p = p.trim();
  if (!p) { alert("密码不能为空"); return; }
  adminAction("admin/account_pass", { user: u, pass: p }, "修改密码").then(loadAccounts);
}

function delAccount(u) {
  if (!confirm("确定删除账号「" + u + "」吗？删除后这个账号无法登录！")) return;
  adminAction("admin/account_del", { user: u }, "删除账号").then(loadAccounts);
}

function adminAction(path, body, verb) {
  errBox("");
  return fetch(PROXY + "/" + path, {
    method: "POST",
    headers: { "Content-Type": "application/json", "X-Admin-Password": ADMIN_PASSWORD },
    body: JSON.stringify(body)
  }).then(function (r) {
    return r.json().then(function (d) { return { ok: r.ok, d: d }; });
  }).then(function (res) {
    if (!res.ok) throw new Error((res.d && res.d.error) || "接口返回错误");
    alert(verb + "成功");
  }).catch(function (err) {
    errBox(verb + "失败：" + (err.message || err));
    throw err;
  });
}

/* ---------- 登录 ---------- */
document.getElementById("btn-login").addEventListener("click", tryLogin);
document.getElementById("pwd").addEventListener("keydown", function (e) {
  if (e.key === "Enter") tryLogin();
});
function tryLogin() {
  var pwd = document.getElementById("pwd").value;
  var btn = document.getElementById("btn-login");
  btn.disabled = true;
  fetch(PROXY + "/admin/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ password: pwd })
  }).then(function (r) {
    return r.json().then(function (d) { return { ok: r.ok, d: d }; });
  }).then(function (res) {
    if (!res.ok) throw new Error(res.d.error || "密码不对哦");
    ADMIN_PASSWORD = pwd;
    document.getElementById("login").style.display = "none";
    document.getElementById("app").style.display = "block";
    load();
    loadAccounts();
  }).catch(function (err) {
    document.getElementById("err").textContent = err.message || "密码不对哦";
  }).finally(function () {
    btn.disabled = false;
  });
}
</script>
